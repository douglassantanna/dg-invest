<header
  class="flex h-16 items-center justify-between gap-2 border-b-2 bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">

  <div class="flex g-2">
    <button class="text-gray-900 cursor-pointer ml-6 font-bold dark:text-gray-100 sm:hidden"
      (click)="toggleSidenavEvent.emit()">
      <span class="material-icons">menu</span>
    </button>

    <img [src]="'https://dgistage.blob.core.windows.net/images/alt-09-logo-v1.png'" alt="logo"
      class="w-24 h-15 ml-5 mb-3 md:hidden lg:hidden xl:hidden">
  </div>

  <div role="status" aria-live="polite" aria-label="Current account"
    class="flex min-w-0 items-center gap-2 px-3 py-2 text-left">
    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
      <span class="material-icons text-xl" aria-hidden="true">account_balance_wallet</span>
    </span>
    <span class="min-w-0">
      <span class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Current account</span>
      <span class="block max-w-[11rem] truncate text-sm font-semibold text-gray-900 dark:text-gray-100">{{ accountTag() }}</span>
    </span>
  </div>

  <div class="flex items-center mr-6 sm:mr-4">
    <div id="username-initial-letter"
      class="h-10 w-10 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center">
      <span class="text-base font-bold text-blue-600 dark:text-blue-300">
        {{ username() | slice: 0:1 }}
      </span>
    </div>
  </div>

</header>
