name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment configuration to validate/deploy
        required: true
        type: choice
        options:
          - stage
          - prod
      apply:
        description: Apply the Bicep deployment after validation and what-if
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-infra-TestDouglas
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Validate and deploy ${{ inputs.target_environment }} infrastructure
    runs-on: ubuntu-latest
    environment: azure-infra-sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Confirm deployment credentials and target scope
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$SQL_ADMIN_PASSWORD" || { echo "SQL_ADMIN_PASSWORD is required in the azure-infra-sandbox environment."; exit 1; }
          actual_subscription=$(az account show --query id --output tsv)
          test "$actual_subscription" = "$AZURE_SUBSCRIPTION_ID" || { echo "Authenticated subscription does not match AZURE_SUBSCRIPTION_ID."; exit 1; }
          az group show --name TestDouglas --output none

      - name: Build Bicep
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/environments/${{ inputs.target_environment }}.bicepparam --stdout > /dev/null

      - name: Validate deployment
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group validate \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --parameters infra/environments/${{ inputs.target_environment }}.bicepparam

      - name: Show what-if changes
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --parameters infra/environments/${{ inputs.target_environment }}.bicepparam \
            --result-format FullResourcePayloads

      - name: Apply infrastructure
        if: ${{ inputs.apply }}
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --parameters infra/environments/${{ inputs.target_environment }}.bicepparam \
            --output none

      - name: Collect app outbound IP addresses
        if: ${{ inputs.apply }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          deployment_name="dginvest-${TARGET_ENVIRONMENT}-infra"
          api_ips=$(az deployment group show \
            --resource-group TestDouglas \
            --name "$deployment_name" \
            --query "properties.outputs.apiPossibleOutboundIpAddresses.value" \
            --output tsv)
          function_ips=$(az deployment group show \
            --resource-group TestDouglas \
            --name "$deployment_name" \
            --query "properties.outputs.functionPossibleOutboundIpAddresses.value" \
            --output tsv)

          test -n "$api_ips" || { echo "Bicep deployment output apiPossibleOutboundIpAddresses is empty."; exit 1; }
          test -n "$function_ips" || { echo "Bicep deployment output functionPossibleOutboundIpAddresses is empty."; exit 1; }

          sql_firewall_ips=$(python3 -c 'import sys; print(",".join(sorted({ip.strip() for group in sys.argv[1:] for ip in group.split(",") if ip.strip()})))' "$api_ips" "$function_ips")
          test -n "$sql_firewall_ips" || { echo "No SQL firewall IP addresses were collected."; exit 1; }
          printf 'SQL_FIREWALL_IP_ADDRESSES=%s\n' "$sql_firewall_ips" >> "$GITHUB_ENV"
          printf 'Collected %s outbound IP addresses for the SQL firewall.\n' "$(python3 -c 'import sys; print(len([ip for ip in sys.argv[1].split(",") if ip]))' "$sql_firewall_ips")" >> "$GITHUB_STEP_SUMMARY"

      - name: Show SQL firewall what-if changes
        if: ${{ inputs.apply }}
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --parameters infra/environments/${{ inputs.target_environment }}.bicepparam \
            --result-format FullResourcePayloads

      - name: Apply SQL firewall rules
        if: ${{ inputs.apply }}
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --parameters infra/environments/${{ inputs.target_environment }}.bicepparam \
            --output none

      - name: Show deployment outputs
        if: ${{ inputs.apply }}
        run: |
          az deployment group show \
            --resource-group TestDouglas \
            --name dginvest-${{ inputs.target_environment }}-infra \
            --query properties.outputs \
            --output json
