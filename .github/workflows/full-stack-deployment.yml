name: Full Stack Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: environment
        required: true

concurrency:
  group: full-stack-deployment-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PACKAGE_PATH: "api/api/api.csproj"
      SOLUTION: "api/dg-invest.api.sln"

    steps:
      - uses: actions/checkout@v3

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build with dotnet
        run: dotnet build ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --configuration Release

      - name: dotnet publish
        run: dotnet publish ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: build_backend
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.14.0"

      # Install dependencies
      - name: Install dependencies
        working-directory: ./web-app
        run: npm install

      # Build the Angular app
      - name: Build Angular app
        working-directory: ./web-app
        run: |
          lower_env=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          npm run build --if-present -- --configuration=$lower_env

      # Upload Build Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: .web-app
          path: web-app/dist

  build_functions:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    needs: build_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Publish Azure Functions
        run: dotnet publish api/functions/functions.csproj -c Release -o ${{ runner.temp }}/functions-app

      - name: Upload Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: .functions-app
          path: ${{ runner.temp }}/functions-app
          include-hidden-files: true

  deploy_backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build_frontend, migrate_database]
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Wait for Approval
        run: echo "Approval needed before deploying to production"
        id: approval
        if: ${{ github.event.inputs.approve == 'approved' }}

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: "production"
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

  migrate_database:
    name: Apply EF Core Migrations
    runs-on: ubuntu-latest
    needs: build_backend
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 8.0.7

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F658D4E23CC64BD9867C60926DB443A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_90749159632E4B86A6E42BDBD348C970 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEF2E26C8C1843A9ADBD8E3F229A3EAF }}

      - name: Allow this runner through Azure SQL firewall
        env:
          AZURE_SQL_RESOURCE_GROUP: ${{ vars.AZURE_SQL_RESOURCE_GROUP }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          FIREWALL_RULE_NAME: github-actions-${{ github.run_id }}
        run: |
          RUNNER_IP=$(curl -4 -s https://api.ipify.org)
          test -n "$RUNNER_IP"
          echo "Allowing GitHub Actions runner IP $RUNNER_IP through Azure SQL firewall"
          az sql server firewall-rule create \
            --resource-group "$AZURE_SQL_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Apply database migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project api/api/api.csproj \
            --startup-project api/api/api.csproj

      - name: Remove temporary Azure SQL firewall rule
        if: ${{ always() }}
        env:
          AZURE_SQL_RESOURCE_GROUP: ${{ vars.AZURE_SQL_RESOURCE_GROUP }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          FIREWALL_RULE_NAME: github-actions-${{ github.run_id }}
        run: |
          if az sql server firewall-rule show \
            --resource-group "$AZURE_SQL_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE_NAME" \
            >/dev/null 2>&1; then
            az sql server firewall-rule delete \
              --resource-group "$AZURE_SQL_RESOURCE_GROUP" \
              --server "$AZURE_SQL_SERVER_NAME" \
              --name "$FIREWALL_RULE_NAME" \
              --yes
          fi

  deploy_functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: [build_functions, migrate_database]
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Download Functions artifact
        uses: actions/download-artifact@v4
        with:
          name: .functions-app

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_NAME }}
          slot-name: "Production"
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTION_APP_TOKEN }}

  deploy_frontend:
    name: Deploy Frontend to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [deploy_backend, deploy_functions]
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: .web-app

      - name: Deploy to Azure Static Web App (${{ github.event.inputs.environment }})
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APP_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/web-app"
          api_location: ""
          output_location: "dist/web-app"
